<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bgA" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#16302444"/><stop offset="0%" stop-color="#163024"/><stop offset="100%" stop-color="#0c1812"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="780" fill="url(#bgA)"/>

  <text x="48" y="60" fill="#2bb8a3" font-size="38" font-weight="800">ALT A — "BRUME D'ÉMERAUDE"</text>
  <text x="48" y="90" fill="#d8e8df" font-size="17">Forêt-monde mystique · cosy · brume &amp; bioluminescence · fae/esprits · idéal identité métiers + co-op</text>
  <line x1="48" y1="106" x2="1232" y2="106" stroke="#14241d" stroke-width="2"/>

  <!-- palette -->
  <text x="48" y="146" fill="#d8e8df" font-size="20" font-weight="700">Palette</text>
  <g transform="translate(48,162)" font-size="12" font-weight="700" text-anchor="middle">
    <g><rect width="118" height="80" rx="10" fill="#2e9e6b" stroke="#14241d" stroke-width="3"/><text x="59" y="44" fill="#0c1812">ÉMERAUDE</text><text x="59" y="62" fill="#0c1812">#2e9e6b</text></g>
    <g transform="translate(132,0)"><rect width="118" height="80" rx="10" fill="#6aa84f" stroke="#14241d" stroke-width="3"/><text x="59" y="44" fill="#0c1812">MOUSSE</text><text x="59" y="62" fill="#0c1812">#6aa84f</text></g>
    <g transform="translate(264,0)"><rect width="118" height="80" rx="10" fill="#2bb8a3" stroke="#14241d" stroke-width="3"/><text x="59" y="44" fill="#0c1812">TEAL</text><text x="59" y="62" fill="#0c1812">#2bb8a3</text></g>
    <g transform="translate(396,0)"><rect width="118" height="80" rx="10" fill="#c64b9c" stroke="#14241d" stroke-width="3"/><text x="59" y="44" fill="#0c1812">MAGIE</text><text x="59" y="62" fill="#0c1812">#c64b9c</text></g>
    <g transform="translate(528,0)"><rect width="118" height="80" rx="10" fill="#7a5cc4" stroke="#14241d" stroke-width="3"/><text x="59" y="44" fill="#fff">VIOLET</text><text x="59" y="62" fill="#fff">#7a5cc4</text></g>
    <g transform="translate(660,0)"><rect width="118" height="80" rx="10" fill="#e8c24e" stroke="#14241d" stroke-width="3"/><text x="59" y="44" fill="#0c1812">OR/LOOT</text><text x="59" y="62" fill="#0c1812">#e8c24e</text></g>
    <g transform="translate(792,0)"><rect width="118" height="80" rx="10" fill="#d8e8df" stroke="#14241d" stroke-width="3"/><text x="59" y="44" fill="#0c1812">BRUME</text><text x="59" y="62" fill="#0c1812">#d8e8df</text></g>
    <g transform="translate(924,0)"><rect width="118" height="80" rx="10" fill="#14241d" stroke="#3a5a48" stroke-width="3"/><text x="59" y="44" fill="#d8e8df">OUTLINE</text><text x="59" y="62" fill="#d8e8df">#14241d</text></g>
  </g>
  <text x="48" y="272" fill="#7fa792" font-size="13">Monde = verts profonds + brume claire. Magenta/violet = magie &amp; bioluminescence (feedback skill). Or = loot/récolte. Ambiance chaleureuse, lisible.</text>

  <!-- base char -->
  <text x="48" y="318" fill="#d8e8df" font-size="20" font-weight="700">Perso — base</text>
  <g transform="translate(120,344)">
    <circle cx="60" cy="92" r="0"/>
    <ellipse cx="60" cy="232" rx="50" ry="15" fill="#000" opacity="0.3"/>
    <path d="M22 150 Q22 120 60 116 Q98 120 98 150 L104 224 Q60 236 16 224 Z" fill="#2e9e6b" stroke="#14241d" stroke-width="4"/>
    <path d="M60 118 Q98 122 98 150 L104 224 Q82 230 60 230 Z" fill="#000" opacity="0.13"/>
    <rect x="20" y="178" width="80" height="14" rx="6" fill="#c64b9c" stroke="#14241d" stroke-width="3"/>
    <circle cx="14" cy="170" r="14" fill="#26865a" stroke="#14241d" stroke-width="4"/>
    <circle cx="106" cy="170" r="14" fill="#26865a" stroke="#14241d" stroke-width="4"/>
    <circle cx="60" cy="92" r="40" fill="#cdb79a" stroke="#14241d" stroke-width="4"/>
    <path d="M22 86 Q24 50 60 48 Q96 50 98 86 Q80 64 60 64 Q40 64 22 86 Z" fill="#3a5a3a"/>
