    <path d="M18 66 Q20 36 50 34 Q80 36 82 66 Q66 48 50 48 Q34 48 18 66 Z" fill="#123a32"/>
    <text x="92" y="50" font-size="18" fill="#2bb8a3">✦</text><text x="0" y="96" font-size="14" fill="#c64b9c">✦</text>
    <text x="50" y="204" fill="#2bb8a3" font-size="13" text-anchor="middle" font-weight="700">"Luciole" (glow)</text>
  </g>
  <text x="940" y="660" fill="#7fa792" font-size="13" text-anchor="middle">Mockup vectoriel —</text>
  <text x="940" y="680" fill="#7fa792" font-size="13" text-anchor="middle">direction, pas l'art final.</text>
