    <path d="M60 50 Q52 30 64 22 Q70 34 60 50 Z" fill="#6aa84f" stroke="#14241d" stroke-width="2"/>
    <circle cx="48" cy="96" r="4" fill="#14241d"/><circle cx="72" cy="96" r="4" fill="#14241d"/>
    <!-- bioluminescent dots -->
    <circle cx="105" cy="206" r="3" fill="#2bb8a3"/><circle cx="18" cy="200" r="3" fill="#2bb8a3"/>
  </g>
  <g font-size="13" fill="#7fa792">
    <text x="280" y="372" fill="#d8e8df" font-weight="700" font-size="14">Pourquoi cette DA</text>
    <text x="280" y="396">· Cosy-mystique → colle aux boucles récolte/craft (l'esprit Dofus en forêt-monde)</text>
    <text x="280" y="418">· Bioluminescence = skins à "glow" très vendeurs (auras, traînées, motifs lumineux)</text>
    <text x="280" y="440">· Verts dominants = repos visuel sur longues sessions de farm</text>
    <text x="280" y="462" fill="#c64b9c">· Risque : moins "punchy" en arène PvP que des terres chaudes — magie magenta compense</text>
    <text x="280" y="484">· Réfs d'ambiance : Hollow-Knight-meets-Ori (sans le pixel), bestiaire fae/champignons</text>
  </g>

  <!-- skins -->
  <text x="48" y="556" fill="#d8e8df" font-size="20" font-weight="700">Skins (palette-swap, même silhouette)</text>
