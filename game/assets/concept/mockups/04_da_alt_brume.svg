    <path d="M18 116 Q18 92 50 89 Q82 92 82 116 L87 172 Q50 182 13 172 Z" fill="#e8c24e" stroke="#14241d" stroke-width="4"/>
    <rect x="16" y="138" width="68" height="12" rx="5" fill="#2e9e6b" stroke="#14241d" stroke-width="3"/>
    <circle cx="50" cy="70" r="32" fill="#cdb79a" stroke="#14241d" stroke-width="4"/>
    <path d="M18 66 Q20 36 50 34 Q80 36 82 66 Q66 48 50 48 Q34 48 18 66 Z" fill="#7a5a28"/>
