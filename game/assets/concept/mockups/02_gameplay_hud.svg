<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <!-- ===== WORLD (top-down greybox) ===== -->
  <rect width="1280" height="720" fill="#6a8d4f"/>
  <!-- ground tile grid (savane) -->
  <g opacity="0.18" stroke="#3f5a2e" stroke-width="2">
    <path d="M0 64 H1280 M0 128 H1280 M0 192 H1280 M0 256 H1280 M0 320 H1280 M0 384 H1280 M0 448 H1280 M0 512 H1280 M0 576 H1280 M0 640 H1280"/>
    <path d="M64 0 V720 M128 0 V720 M192 0 V720 M256 0 V720 M320 0 V720 M384 0 V720 M448 0 V720 M512 0 V720 M576 0 V720 M640 0 V720 M704 0 V720 M768 0 V720 M832 0 V720 M896 0 V720 M960 0 V720 M1024 0 V720 M1088 0 V720 M1152 0 V720 M1216 0 V720"/>
  </g>
  <!-- dirt path -->
  <path d="M-20 300 Q400 360 640 340 Q900 320 1300 420 L1300 520 Q900 430 640 460 Q380 480 -20 420 Z" fill="#b07a45" opacity="0.85"/>
  <!-- water pond (turquoise accent in world, ok as decor) -->
  <ellipse cx="1060" cy="180" rx="150" ry="90" fill="#2f9e92" stroke="#1c5f58" stroke-width="5"/>
  <ellipse cx="1060" cy="180" rx="150" ry="90" fill="none" stroke="#33b3a6" stroke-width="2" opacity="0.6"/>

  <!-- trees (decor) -->
  <g>
    <ellipse cx="180" cy="160" rx="14" ry="6" fill="#000" opacity="0.25"/>
    <rect x="174" y="120" width="12" height="36" rx="4" fill="#5a3d22" stroke="#2b1d16" stroke-width="3"/>
    <circle cx="180" cy="110" r="34" fill="#4f6e38" stroke="#2b1d16" stroke-width="4"/>
    <ellipse cx="300" cy="600" rx="16" ry="6" fill="#000" opacity="0.25"/>
    <rect x="293" y="556" width="14" height="42" rx="4" fill="#5a3d22" stroke="#2b1d16" stroke-width="3"/>
    <circle cx="300" cy="544" r="40" fill="#4f6e38" stroke="#2b1d16" stroke-width="4"/>
  </g>

  <!-- RESOURCE NODE (farm Dofus-like) -->
  <g transform="translate(420,180)">
    <ellipse cx="0" cy="34" rx="34" ry="10" fill="#000" opacity="0.25"/>
    <path d="M-26 30 L-16 -10 L18 -16 L30 22 Z" fill="#9aa3ad" stroke="#2b1d16" stroke-width="4"/>
    <path d="M-6 -2 L2 -28 L14 -6 Z" fill="#e8d6b3" stroke="#2b1d16" stroke-width="3"/>
    <circle cx="0" cy="-40" r="14" fill="#f2c14e" stroke="#2b1d16" stroke-width="3"/>
    <text x="0" y="-36" font-size="14" text-anchor="middle" fill="#2b1d16" font-weight="700">⛏</text>
    <text x="0" y="64" font-size="13" text-anchor="middle" fill="#15100c" font-weight="700">Filon (Mineur Niv.2)</text>
  </g>

  <!-- ALLY (co-op) -->
  <g transform="translate(520,430)" opacity="0.98">
    <ellipse cx="0" cy="44" rx="30" ry="9" fill="#000" opacity="0.28"/>
    <path d="M-22 0 Q-22 -22 0 -24 Q22 -22 22 0 L26 42 Q0 50 -26 42 Z" fill="#3b4a8c" stroke="#2b1d16" stroke-width="4"/>
    <circle cx="0" cy="-30" r="24" fill="#8a5a3c" stroke="#2b1d16" stroke-width="4"/>
    <path d="M-22 -34 Q-20 -54 0 -56 Q20 -54 22 -34 Q8 -46 0 -46 Q-8 -46 -22 -34 Z" fill="#2b1d16"/>
    <rect x="-30" y="-78" width="60" height="9" rx="4" fill="#15100c" opacity="0.6"/>
    <rect x="-28" y="-76" width="48" height="5" rx="2" fill="#33b3a6"/>
    <text x="0" y="-92" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">Kofi</text>
  </g>

  <!-- MOB -->
  <g transform="translate(800,470)">
    <ellipse cx="0" cy="40" rx="34" ry="10" fill="#000" opacity="0.3"/>
    <path d="M-30 6 Q-30 -20 0 -22 Q30 -20 30 6 L30 30 Q0 40 -30 30 Z" fill="#7a4a2e" stroke="#2b1d16" stroke-width="4"/>
    <circle cx="-12" cy="-4" r="6" fill="#d1495b"/>
    <circle cx="12" cy="-4" r="6" fill="#d1495b"/>
    <path d="M-22 -18 L-14 -30 M22 -18 L14 -30" stroke="#2b1d16" stroke-width="4" stroke-linecap="round"/>
    <rect x="-34" y="-46" width="68" height="9" rx="4" fill="#15100c" opacity="0.6"/>
    <rect x="-32" y="-44" width="44" height="5" rx="2" fill="#d1495b"/>
    <text x="0" y="-58" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">Hyène · Niv.4</text>
  </g>

  <!-- PLAYER (center, with skill telegraph in turquoise) -->
  <g transform="translate(620,360)">
    <circle cx="0" cy="6" r="58" fill="#33b3a6" opacity="0.18" stroke="#33b3a6" stroke-width="2"/>
    <ellipse cx="0" cy="48" rx="34" ry="10" fill="#000" opacity="0.32"/>
    <path d="M-24 0 Q-24 -26 0 -28 Q24 -26 24 0 L28 46 Q0 56 -28 46 Z" fill="#c8643c" stroke="#2b1d16" stroke-width="4"/>
    <rect x="-26" y="20" width="52" height="11" rx="5" fill="#33b3a6" stroke="#2b1d16" stroke-width="3"/>
    <circle cx="0" cy="-34" r="26" fill="#8a5a3c" stroke="#2b1d16" stroke-width="4"/>
    <path d="M-24 -38 Q-22 -60 0 -62 Q22 -60 24 -38 Q8 -50 0 -50 Q-8 -50 -24 -38 Z" fill="#2b1d16"/>
    <circle cx="-9" cy="-32" r="3.5" fill="#15100c"/>
    <circle cx="9" cy="-32" r="3.5" fill="#15100c"/>
    <!-- attack arc telegraph -->
    <path d="M28 10 A48 48 0 0 1 28 -2" fill="none" stroke="#f2c14e" stroke-width="6" opacity="0.9"/>
    <text x="0" y="-78" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">TOI · Niv.5</text>
  </g>
  <!-- hit feedback -->
  <text x="845" y="430" font-size="26" fill="#f2c14e" font-weight="800" transform="rotate(-12 845 430)">-42!</text>

  <!-- ===== HUD OVERLAY ===== -->
  <!-- top-left: portrait + bars -->
  <g transform="translate(24,24)">
    <rect width="300" height="84" rx="14" fill="#15100c" opacity="0.78"/>
    <circle cx="48" cy="42" r="30" fill="#c8643c" stroke="#f2c14e" stroke-width="3"/>
    <circle cx="40" cy="38" r="3.5" fill="#15100c"/><circle cx="56" cy="38" r="3.5" fill="#15100c"/>
    <text x="90" y="34" fill="#e8d6b3" font-size="16" font-weight="700">Niv. 5</text>
    <!-- HP -->
    <rect x="90" y="42" width="190" height="14" rx="7" fill="#3a1414"/>
    <rect x="90" y="42" width="140" height="14" rx="7" fill="#d1495b"/>
    <text x="186" y="53" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">320 / 460</text>
    <!-- XP -->
    <rect x="90" y="62" width="190" height="9" rx="4" fill="#2b1d16"/>
    <rect x="90" y="62" width="110" height="9" rx="4" fill="#f2c14e"/>
  </g>

  <!-- top-right: minimap -->
  <g transform="translate(1116,24)">
    <rect width="140" height="140" rx="14" fill="#15100c" opacity="0.78"/>
    <rect x="10" y="10" width="120" height="120" rx="8" fill="#4f6e38"/>
    <path d="M10 70 Q60 80 130 60 L130 86 Q60 96 10 84 Z" fill="#b07a45"/>
    <circle cx="70" cy="70" r="5" fill="#f2c14e" stroke="#15100c" stroke-width="2"/>
    <circle cx="48" cy="92" r="4" fill="#33b3a6"/>
    <circle cx="96" cy="96" r="4" fill="#d1495b"/>
    <text x="70" y="132" fill="#e8d6b3" font-size="10" text-anchor="middle">Savane d'Akwaba</text>
  </g>

  <!-- party (left) -->
  <g transform="translate(24,124)" font-size="12">
    <rect width="170" height="40" rx="10" fill="#15100c" opacity="0.7"/>
    <circle cx="24" cy="20" r="13" fill="#3b4a8c" stroke="#33b3a6" stroke-width="2"/>
    <text x="46" y="17" fill="#e8d6b3" font-weight="700">Kofi</text>
    <rect x="46" y="22" width="108" height="7" rx="3" fill="#3a1414"/>
    <rect x="46" y="22" width="84" height="7" rx="3" fill="#33b3a6"/>
  </g>

  <!-- skill bar (bottom center) -->
  <g transform="translate(452,632)">
    <rect width="376" height="72" rx="16" fill="#15100c" opacity="0.8"/>
    <g font-size="11" text-anchor="middle">
      <g transform="translate(16,12)"><rect width="56" height="48" rx="10" fill="#2b1d16" stroke="#f2c14e" stroke-width="2"/><text x="28" y="30" fill="#c8643c" font-size="22">⚔</text><text x="28" y="62" fill="#e8d6b3">Clic G</text></g>
      <g transform="translate(84,12)"><rect width="56" height="48" rx="10" fill="#2b1d16" stroke="#33b3a6" stroke-width="2"/><text x="28" y="30" fill="#33b3a6" font-size="20">✦</text><text x="28" y="62" fill="#e8d6b3">1</text></g>
      <g transform="translate(152,12)"><rect width="56" height="48" rx="10" fill="#2b1d16" stroke="#33b3a6" stroke-width="2"/><text x="28" y="30" fill="#33b3a6" font-size="20">❂</text><text x="28" y="62" fill="#e8d6b3">2</text></g>
      <g transform="translate(220,12)"><rect width="56" height="48" rx="10" fill="#2b1d16" stroke="#3b4a8c" stroke-width="2" opacity="0.6"/><text x="28" y="30" fill="#3b4a8c" font-size="20">◇</text><text x="28" y="38" fill="#fff" font-size="14" font-weight="700">3.2s</text><text x="28" y="62" fill="#e8d6b3">3</text></g>
      <g transform="translate(288,12)"><rect width="56" height="48" rx="10" fill="#2b1d16" stroke="#e8d6b3" stroke-width="2"/><text x="28" y="32" fill="#e8d6b3" font-size="20">⟳</text><text x="28" y="62" fill="#e8d6b3">Esquive</text></g>
    </g>
  </g>

  <!-- quest tracker (right) -->
  <g transform="translate(1036,200)" font-size="12">
    <rect width="220" height="92" rx="12" fill="#15100c" opacity="0.72"/>
    <text x="14" y="26" fill="#f2c14e" font-weight="700" font-size="14">⚑ Chasse aux hyènes</text>
    <text x="14" y="50" fill="#e8d6b3">Hyènes vaincues … 3 / 5</text>
    <rect x="14" y="60" width="192" height="8" rx="4" fill="#2b1d16"/>
    <rect x="14" y="60" width="115" height="8" rx="4" fill="#6a8d4f"/>
    <text x="14" y="84" fill="#9a8a78">Récolté : Minerai brut ×4</text>
  </g>

  <!-- caption -->
  <rect x="0" y="700" width="1280" height="20" fill="#15100c" opacity="0.6"/>
  <text x="12" y="714" fill="#9a8a78" font-size="12">Mockup HUD/greybox — combat + co-op + farm. Turquoise = telegraph de skill. Or = feedback de hit. Art final via pipeline.</text>
</svg>
