    <path d="M18 66 Q20 36 50 34 Q80 36 82 66 Q66 48 50 48 Q34 48 18 66 Z" fill="#0d3438"/>
    <text x="50" y="204" fill="#34d6e0" font-size="13" text-anchor="middle" font-weight="700">"Givre néon"</text>
