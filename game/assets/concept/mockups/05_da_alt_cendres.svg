    <text x="88" y="44" font-size="16" fill="#8a4fff">✦</text>
    <text x="50" y="204" fill="#8a4fff" font-size="13" text-anchor="middle" font-weight="700">"Spectre" (glow)</text>
  </g>
  <g transform="translate(520,576)">
    <ellipse cx="50" cy="174" rx="42" ry="12" fill="#000" opacity="0.4"/>
