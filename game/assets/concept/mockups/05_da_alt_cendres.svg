    <path d="M18 116 Q18 92 50 89 Q82 92 82 116 L87 172 Q50 182 13 172 Z" fill="#7a1f1f" stroke="#ef6c3a" stroke-width="4"/>
    <rect x="16" y="138" width="68" height="12" rx="5" fill="#f2b33e" stroke="#120e18" stroke-width="3"/>
    <circle cx="50" cy="70" r="32" fill="#e0b59a" stroke="#ef6c3a" stroke-width="4"/>
    <path d="M18 66 Q20 36 50 34 Q80 36 82 66 Q66 48 50 48 Q34 48 18 66 Z" fill="#2a0e0e"/>
    <text x="86" y="48" font-size="16" fill="#ef6c3a">✦</text><text x="2" y="92" font-size="14" fill="#d13b3b">✦</text>
    <text x="50" y="204" fill="#ef6c3a" font-size="13" text-anchor="middle" font-weight="700">"Forge" (glow)</text>
