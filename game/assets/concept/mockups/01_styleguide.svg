<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#241a14"/>
      <stop offset="100%" stop-color="#15100c"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="48" y="64" fill="#f2c14e" font-size="40" font-weight="700">AURENDEL — Style Guide</text>
  <text x="48" y="94" fill="#e8d6b3" font-size="18">Cartoon illustré · outline net + ombrage doux · top-down 3/4 · ouest-africain stylisé fantasy</text>
  <line x1="48" y1="112" x2="1232" y2="112" stroke="#2b1d16" stroke-width="2"/>

  <!-- PALETTE -->
  <text x="48" y="156" fill="#e8d6b3" font-size="22" font-weight="700">Palette</text>
  <g transform="translate(48,176)" font-size="13" fill="#15100c" font-weight="700" text-anchor="middle">
    <g><rect width="120" height="90" rx="10" fill="#c8643c" stroke="#2b1d16" stroke-width="3"/><text x="60" y="50" fill="#15100c">TERRACOTTA</text><text x="60" y="70" fill="#15100c">#c8643c</text></g>
    <g transform="translate(136,0)"><rect width="120" height="90" rx="10" fill="#d99a4e" stroke="#2b1d16" stroke-width="3"/><text x="60" y="50">OCRE</text><text x="60" y="70">#d99a4e</text></g>
    <g transform="translate(272,0)"><rect width="120" height="90" rx="10" fill="#f2c14e" stroke="#2b1d16" stroke-width="3"/><text x="60" y="50">OR</text><text x="60" y="70">#f2c14e</text></g>
    <g transform="translate(408,0)"><rect width="120" height="90" rx="10" fill="#e8d6b3" stroke="#2b1d16" stroke-width="3"/><text x="60" y="50">SABLE</text><text x="60" y="70">#e8d6b3</text></g>
    <g transform="translate(544,0)"><rect width="120" height="90" rx="10" fill="#33b3a6" stroke="#2b1d16" stroke-width="3"/><text x="60" y="50" fill="#15100c">TURQUOISE</text><text x="60" y="70" fill="#15100c">#33b3a6</text></g>
    <g transform="translate(680,0)"><rect width="120" height="90" rx="10" fill="#3b4a8c" stroke="#2b1d16" stroke-width="3"/><text x="60" y="50" fill="#e8d6b3">INDIGO</text><text x="60" y="70" fill="#e8d6b3">#3b4a8c</text></g>
    <g transform="translate(816,0)"><rect width="120" height="90" rx="10" fill="#6a8d4f" stroke="#2b1d16" stroke-width="3"/><text x="60" y="50">FEUILLAGE</text><text x="60" y="70">#6a8d4f</text></g>
    <g transform="translate(952,0)"><rect width="120" height="90" rx="10" fill="#d1495b" stroke="#2b1d16" stroke-width="3"/><text x="60" y="50" fill="#15100c">DANGER</text><text x="60" y="70" fill="#15100c">#d1495b</text></g>
    <g transform="translate(1088,0)"><rect width="96" height="90" rx="10" fill="#2b1d16" stroke="#5a4636" stroke-width="3"/><text x="48" y="50" fill="#e8d6b3">OUTLINE</text><text x="48" y="70" fill="#e8d6b3">#2b1d16</text></g>
  </g>
  <text x="48" y="298" fill="#9a8a78" font-size="13">Terres chaudes = monde &amp; perso. Turquoise/Indigo = RÉSERVÉS au feedback skill/magie (lisibilité gameplay). Danger = dégâts/aggro.</text>

  <!-- CHARACTER BASE (top-down 3/4) -->
  <text x="48" y="350" fill="#e8d6b3" font-size="22" font-weight="700">Perso — silhouette de base (vue 3/4)</text>

  <g transform="translate(120,380)">
    <!-- shadow -->
    <ellipse cx="60" cy="232" rx="52" ry="16" fill="#000000" opacity="0.28"/>
    <!-- body / tunic -->
    <path d="M22 150 Q22 120 60 116 Q98 120 98 150 L104 224 Q60 236 16 224 Z" fill="#c8643c" stroke="#2b1d16" stroke-width="4"/>
    <!-- soft shading -->
    <path d="M60 118 Q98 122 98 150 L104 224 Q82 230 60 230 Z" fill="#000000" opacity="0.12"/>
    <!-- belt accent -->
    <rect x="20" y="178" width="80" height="14" rx="6" fill="#33b3a6" stroke="#2b1d16" stroke-width="3"/>
    <!-- arms -->
    <circle cx="14" cy="170" r="14" fill="#a8552f" stroke="#2b1d16" stroke-width="4"/>
    <circle cx="106" cy="170" r="14" fill="#a8552f" stroke="#2b1d16" stroke-width="4"/>
    <!-- head -->
    <circle cx="60" cy="92" r="40" fill="#8a5a3c" stroke="#2b1d16" stroke-width="4"/>
    <!-- hair / wrap -->
    <path d="M22 86 Q24 54 60 52 Q96 54 98 86 Q80 70 60 70 Q40 70 22 86 Z" fill="#2b1d16"/>
    <!-- face hint -->
    <circle cx="48" cy="96" r="4" fill="#15100c"/>
    <circle cx="72" cy="96" r="4" fill="#15100c"/>
    <text x="60" y="270" fill="#e8d6b3" font-size="14" text-anchor="middle" font-weight="700">BASE</text>
  </g>

  <!-- callouts -->
  <g font-size="13" fill="#9a8a78">
    <line x1="248" y1="472" x2="320" y2="472" stroke="#5a4636" stroke-width="2"/>
    <text x="328" y="446" fill="#e8d6b3" font-weight="700" font-size="14">Règles de tracé</text>
    <text x="328" y="470">· Outline uniforme #2b1d16, épaisseur ~4px (constante quelle que soit la pièce)</text>
    <text x="328" y="492">· Ombrage = 1 calque sombre à ~12% en bas/droite (pas de dégradé complexe)</text>
    <text x="328" y="514">· Silhouette lisible à 48px (test mobile) avant tout détail</text>
    <text x="328" y="536">· Tête volontairement grosse (~lecture top-down), 2 points = yeux suffisent en greybox</text>
    <text x="328" y="558" fill="#f2c14e">· 8 directions à animer : idle / walk / attack / dodge / hit / death</text>
  </g>

  <!-- SKIN VARIANTS = palette swap -->
  <text x="48" y="640" fill="#e8d6b3" font-size="22" font-weight="700">Skins = couches / palette-swap (même silhouette → coût art faible)</text>

  <g transform="translate(120,664)">
    <!-- variant A: turquoise -->
    <ellipse cx="50" cy="186" rx="44" ry="13" fill="#000" opacity="0.28"/>
    <path d="M18 124 Q18 98 50 95 Q82 98 82 124 L87 184 Q50 194 13 184 Z" fill="#2f9e92" stroke="#2b1d16" stroke-width="4"/>
    <rect x="16" y="146" width="68" height="12" rx="5" fill="#f2c14e" stroke="#2b1d16" stroke-width="3"/>
    <circle cx="50" cy="76" r="33" fill="#8a5a3c" stroke="#2b1d16" stroke-width="4"/>
    <path d="M18 72 Q20 46 50 44 Q80 46 82 72 Q66 58 50 58 Q34 58 18 72 Z" fill="#2b1d16"/>
    <text x="50" y="218" fill="#e8d6b3" font-size="13" text-anchor="middle">"Lagune"</text>
  </g>
  <g transform="translate(320,664)">
    <ellipse cx="50" cy="186" rx="44" ry="13" fill="#000" opacity="0.28"/>
    <path d="M18 124 Q18 98 50 95 Q82 98 82 124 L87 184 Q50 194 13 184 Z" fill="#3b4a8c" stroke="#2b1d16" stroke-width="4"/>
    <rect x="16" y="146" width="68" height="12" rx="5" fill="#d1495b" stroke="#2b1d16" stroke-width="3"/>
    <circle cx="50" cy="76" r="33" fill="#6b4226" stroke="#2b1d16" stroke-width="4"/>
    <path d="M18 72 Q20 46 50 44 Q80 46 82 72 Q66 58 50 58 Q34 58 18 72 Z" fill="#1a1024"/>
    <text x="50" y="218" fill="#e8d6b3" font-size="13" text-anchor="middle">"Nuit indigo"</text>
  </g>
  <g transform="translate(520,664)">
    <ellipse cx="50" cy="186" rx="44" ry="13" fill="#000" opacity="0.28"/>
    <path d="M18 124 Q18 98 50 95 Q82 98 82 124 L87 184 Q50 194 13 184 Z" fill="#f2c14e" stroke="#2b1d16" stroke-width="4"/>
    <rect x="16" y="146" width="68" height="12" rx="5" fill="#c8643c" stroke="#2b1d16" stroke-width="3"/>
    <circle cx="50" cy="76" r="33" fill="#9c6a44" stroke="#2b1d16" stroke-width="4"/>
    <path d="M18 72 Q20 46 50 44 Q80 46 82 72 Q66 58 50 58 Q34 58 18 72 Z" fill="#3a2a18"/>
    <text x="50" y="218" fill="#e8d6b3" font-size="13" text-anchor="middle">"Or fauve"</text>
  </g>
  <g transform="translate(740,690)" font-size="13" fill="#9a8a78">
    <text x="0" y="0" fill="#f2c14e" font-weight="700" font-size="14">Pipeline skin (cheap)</text>
    <text x="0" y="26">1 silhouette/rig de base → swap de teintes (tunique, ceinture, coiffe)</text>
    <text x="0" y="48">+ overlays optionnels (motif, plumes, aura).</text>
    <text x="0" y="70">Aucun impact stats : 100% visuel, droit vérifié serveur (entitlements).</text>
    <text x="0" y="100" fill="#9a8a78">⚠ Mockups vectoriels = direction &amp; greybox.</text>
    <text x="0" y="120" fill="#9a8a78">Art final : Higgsfield (concept) → ComfyUI/Flux (RTX 4090) → main.</text>
  </g>
</svg>
