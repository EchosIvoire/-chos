# Configuration Nakama — environnement LOCAL de dev uniquement.
# NE PAS utiliser ces secrets en production.

name: nakama-terres-fauves
data_dir: "/nakama/data"

logger:
  level: "INFO"

# Console d'admin : http://127.0.0.1:7351
console:
  username: "admin"
  password: "localdev-change-me"

# Cle de signature des sessions — a remplacer en prod par un secret robuste.
session:
  encryption_key: "terres-fauves-local-dev-key-change-me"
  token_expiry_sec: 7200

# Le runtime JS/TS est charge automatiquement depuis data/modules/.
# index.js (genere par `npm run build` dans ../runtime) sert d'entrypoint.
runtime:
  path: "/nakama/data/modules"

socket:
  server_key: "terres-fauves-server-key-change-me"
